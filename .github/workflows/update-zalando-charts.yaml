name: Update Zalando Postgres Charts

on:
  schedule:
    - cron: '0 3 * * *'  # Todos los días a las 03:00 UTC
  workflow_dispatch:      # Permite ejecución manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para hacer push a gh-pages

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.3

      - name: Clone Zalando Postgres Operator repo
        run: |
          git clone --depth 1 https://github.com/zalando/postgres-operator.git /tmp/postgres-operator

      - name: Package both Zalando charts
        run: |
          mkdir -p .deploy
          helm package /tmp/postgres-operator/charts/postgres-operator -d .deploy
          helm package /tmp/postgres-operator/charts/postgres-operator-ui -d .deploy
          helm repo index .deploy --url https://llamaliticaAI.github.io/helm-charts

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .deploy
          publish_branch: gh-pages
