name: Update Zalando Postgres Charts

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.3

      - name: Set up git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone Zalando Postgres Operator
        run: |
          git clone --depth 1 https://github.com/zalando/postgres-operator.git /tmp/postgres-operator

      - name: Package Zalando charts
        run: |
          helm package /tmp/postgres-operator/charts/postgres-operator -d gh-pages
          helm package /tmp/postgres-operator/charts/postgres-operator-ui -d gh-pages
          helm repo index gh-pages --url https://llamaliticaAI.github.io/helm-charts --merge gh-pages/index.yaml

      - name: Commit and push
        run: |
          cd gh-pages
          git add .
          git commit -m "Update Zalando charts [automated]" || echo "No changes to commit"
          git push origin gh-pages
