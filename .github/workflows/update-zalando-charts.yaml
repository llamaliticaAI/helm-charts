name: Update Zalando Postgres Charts

on:
  schedule:
    - cron: '0 3 * * *'  # todos los días a las 03:00 UTC
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.3

      - name: Restore existing .tgz files from gh-pages
        run: |
          mkdir -p .deploy
          curl -sfL https://llamaliticaAI.github.io/helm-charts/index.yaml -o .deploy/index-old.yaml || true
          grep 'https://llamaliticaAI.github.io/helm-charts/.*\.tgz' .deploy/index-old.yaml | cut -d ' ' -f2 | while read url; do
            fname=$(basename "$url")
            curl -sfL "$url" -o ".deploy/$fname" || echo "Warning: $fname not found"
          done

      - name: Clone Zalando Postgres Operator
        run: |
          git clone --depth 1 https://github.com/zalando/postgres-operator.git /tmp/postgres-operator

      - name: Package Zalando charts
        run: |
          helm package /tmp/postgres-operator/charts/postgres-operator -d .deploy
          helm package /tmp/postgres-operator/charts/postgres-operator-ui -d .deploy
          helm repo index .deploy --url https://llamaliticaAI.github.io/helm-charts --merge .deploy/index-old.yaml

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .deploy
          publish_branch: gh-pages
