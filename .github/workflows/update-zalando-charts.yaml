name: Update Zalando Postgres Charts

on:
  schedule:
    - cron: '0 3 * * *'  # todos los días a las 03:00 UTC
  workflow_dispatch:     # permite lanzarlo manualmente

jobs:
  update-charts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.3

      - name: Clone Zalando Postgres Operator
        run: |
          git clone --depth 1 https://github.com/zalando/postgres-operator.git /tmp/postgres-operator

      - name: Package postgres-operator chart
        run: |
          mkdir -p charts
          helm package /tmp/postgres-operator/charts/postgres-operator -d charts

      - name: Package postgres-operator-ui chart
        run: |
          helm package /tmp/postgres-operator/charts/postgres-operator-ui -d charts

      - name: Rebuild Helm index.yaml
        run: |
          helm repo index charts --url https://<tu_usuario>.github.io/<tu_repo>/charts

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add charts/
          git commit -m "Update Zalando charts [automated]" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main  # o gh-pages, si es donde publicas
