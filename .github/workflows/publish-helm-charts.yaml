name: Publish LetsEncrypt Issuer Chart

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v3
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.3

      - name: Set up git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Package LetsEncrypt Issuer chart
        run: |
          helm package charts/letsencrypt-issuer --destination gh-pages
          helm repo index gh-pages --url https://llamaliticaAI.github.io/helm-charts --merge gh-pages/index.yaml

      - name: Commit and push
        run: |
          cd gh-pages
          git add .
          git commit -m "Update letsencrypt-issuer chart [automated]" || echo "No changes to commit"
          git push origin gh-pages
