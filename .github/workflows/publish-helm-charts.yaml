name: Publish Helm Chart to GitHub Pages

on:
  workflow_dispatch:  # Solo se ejecuta cuando la lanzas manualmente desde la UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para hacer push a gh-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.3

      - name: Package Helm chart Lestencrypt Issuer
        run: |
          mkdir -p .deploy
          helm package charts/letsencrypt-issuer --destination .deploy
          helm repo index .deploy --url https://llamaliticaAI.github.io/infrastructure

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .deploy
          publish_branch: gh-pages
