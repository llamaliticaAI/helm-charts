name: Publish LetsEncrypt Issuer Chart

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.3

      - name: Package letsencrypt-issuer chart
        run: |
          mkdir -p .deploy
          helm package charts/letsencrypt-issuer --destination .deploy
          curl -sfL https://llamaliticaAI.github.io/helm-charts/index.yaml -o .deploy/index-old.yaml || true
          helm repo index .deploy --url https://llamaliticaAI.github.io/helm-charts --merge .deploy/index-old.yaml

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .deploy
          publish_branch: gh-pages
