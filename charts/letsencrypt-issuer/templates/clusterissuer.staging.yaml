{{- if .Values.createStaging }}
# 🏗️ ClusterIssuer para Staging (Let's Encrypt staging server)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Release.Name }}-staging
spec:
  acme:
    email: {{ required "Account email address is required!" .Values.acme.email }}
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: {{ .Values.acme.secretNamePrefix }}-staging
    solvers:
      {{- range .Values.acme.solvers }}
      {{- if hasKey . "http01" }}
      - http01:
          {{- toYaml .http01 | nindent 10 }}
      {{- end }}
      {{- end }}
{{- end }}
