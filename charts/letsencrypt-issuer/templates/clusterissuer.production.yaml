# 🏗️ ClusterIssuer para Producción (Let's Encrypt)
{{- if .Values.createProduction }}

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Release.Name }}-production
spec:
  acme:
    email: {{ required "Account email address is required!" .Values.acme.email }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: {{ .Values.acme.secretNamePrefix }}-production
    solvers:
      {{- range .Values.acme.solvers }}
      {{- if hasKey . "http01" }}
      - http01:
          {{- toYaml .http01 | nindent 10 }}
      {{- end }}
      {{- end }}
{{- end }}
